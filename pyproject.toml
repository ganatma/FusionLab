[project]
name = "fusionlab"
version = "0.1.0"
description = "FusionLab: an open-data tokamak digital twin. Real MAST shots, PhysicsNeMo surrogates, Warp field lines, OpenUSD export"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "torch>=2.3",
  "nvidia-physicsnemo>=1.0",
  "usd-core>=26.8",
  "zarr>=3.0",
  "s3fs>=2026.9.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1", "ruff>=0.16", "mypy>=2.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff.lint]
# ruff's default rule set (E4/E7/E9/F) plus bugbear, pyupgrade, flake8-simplify and isort.
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "I"]

[tool.mypy]
python_version = "3.12"
# the heavy deps (warp, pxr, physicsnemo) ship no type stubs
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.uv]
package = false
