[project]
name = "fusionlab"
version = "0.1.0"
description = "FusionLab: an open-data tokamak digital twin. Real MAST shots, PhysicsNeMo surrogates, Warp field lines, OpenUSD export"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.4.6",
  "fastapi>=0.142.2",
  "uvicorn[standard]>=0.54.0",
  "torch>=2.14.1",
  "nvidia-physicsnemo>=1.0",
  "usd-core>=26.8",
  "zarr>=3.1.6",
  "s3fs>=2026.9.0",
  "anthropic>=1.13.0",
  "pypdf>=6.20.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# User-provided compute over SSH (design outline §3-8): asyncssh for the tunnel,
# httpx for talking to the worker through it. The default install gains nothing.
remote = ["asyncssh>=2.21", "httpx>=0.28.1"]

[project.scripts]
fusionlab-worker = "fusionlab.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fusionlab"]

[dependency-groups]
dev = ["pytest>=9.1.1", "httpx>=0.28.1", "ruff>=0.16", "mypy>=2.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff.lint]
# ruff's default rule set (E4/E7/E9/F) plus bugbear, pyupgrade, flake8-simplify and isort.
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "I"]

[tool.mypy]
python_version = "3.12"
# the heavy deps (warp, pxr, physicsnemo) ship no type stubs
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
