[project]
name = "fusionlab"
version = "0.1.0"
description = "FusionLab: an open-data tokamak digital twin. Real MAST shots, PhysicsNeMo surrogates, Warp field lines, OpenUSD export"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "torch>=2.3",
  "nvidia-physicsnemo>=1.0",
  "usd-core>=24.0",
  "zarr>=3.0",
  "s3fs>=2024.6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
